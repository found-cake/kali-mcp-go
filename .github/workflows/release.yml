name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  validate_tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}. Expected format: vx.y.z"
            exit 1
          fi

  build:
    needs:
      - validate_tag
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # kali-server: Linux only
          - id: kali-server-linux-amd64
            runs_on: ubuntu-latest
            artifact_name: kali-server_linux_amd64
            main: ./cmd/kali-server
            ldflags: -s -w
            goos: linux
            goarch: amd64
          - id: kali-server-linux-arm64
            runs_on: ubuntu-latest
            artifact_name: kali-server_linux_arm64
            main: ./cmd/kali-server
            ldflags: -s -w
            goos: linux
            goarch: arm64
          # mcp-client: Linux / Windows / macOS
          - id: mcp-client-linux-amd64
            runs_on: ubuntu-latest
            artifact_name: mcp-client_linux_amd64
            main: ./cmd/mcp-client
            ldflags: -s -w -X main.version=${{ github.ref_name }}
            goos: linux
            goarch: amd64
          - id: mcp-client-linux-arm64
            runs_on: ubuntu-latest
            artifact_name: mcp-client_linux_arm64
            main: ./cmd/mcp-client
            ldflags: -s -w -X main.version=${{ github.ref_name }}
            goos: linux
            goarch: arm64
          - id: mcp-client-windows-amd64
            runs_on: windows-latest
            artifact_name: mcp-client_windows_amd64.exe
            main: ./cmd/mcp-client
            ldflags: -s -w -X main.version=${{ github.ref_name }}
            goos: windows
            goarch: amd64
          - id: mcp-client-windows-arm64
            runs_on: windows-latest
            artifact_name: mcp-client_windows_arm64.exe
            main: ./cmd/mcp-client
            ldflags: -s -w -X main.version=${{ github.ref_name }}
            goos: windows
            goarch: arm64
          - id: mcp-client-darwin-arm64
            runs_on: macos-latest
            artifact_name: mcp-client_darwin_arm64
            main: ./cmd/mcp-client
            ldflags: -s -w -X main.version=${{ github.ref_name }}
            goos: darwin
            goarch: arm64
          - id: mcp-client-darwin-amd64
            runs_on: macos-latest
            artifact_name: mcp-client_darwin_amd64
            main: ./cmd/mcp-client
            ldflags: -s -w -X main.version=${{ github.ref_name }}
            goos: darwin
            goarch: amd64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="${{ matrix.ldflags }}" -o dist/${{ matrix.artifact_name }} ${{ matrix.main }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  registry_state:
    needs:
      - validate_tag
    runs-on: ubuntu-latest
    outputs:
      latest_digest: ${{ steps.capture.outputs.latest_digest }}
      rolling_digest: ${{ steps.capture.outputs.rolling_digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Capture current image channels
        id: capture
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null \
              | jq -r '.digest // empty' || true
          }
          echo "latest_digest=$(image_digest "${IMAGE}:latest")" >> "${GITHUB_OUTPUT}"
          echo "rolling_digest=$(image_digest "${IMAGE}:rolling")" >> "${GITHUB_OUTPUT}"

  docker_image:
    needs:
      - validate_tag
      - build
      - registry_state
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml

  release:
    needs:
      - build
      - docker_image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download kali-server artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'kali-server-*'
          merge-multiple: true

      - name: Download mcp-client artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'mcp-client-*'
          merge-multiple: true

      # Generate SHA256 checksums to verify binary integrity
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Generate download notes
        run: |
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          VERSION_NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${VERSION_NOTES}" ]]; then
            cat "${VERSION_NOTES}" > release_notes.md
            printf '\n' >> release_notes.md
          else
            : > release_notes.md
          fi
          cat >> release_notes.md << EOF
          ## kali-server (Only Linux)
          - [Ubuntu x64](${BASE_URL}/kali-server_linux_amd64)
          - [Ubuntu arm64](${BASE_URL}/kali-server_linux_arm64)

          ## mcp-client
          - [Ubuntu x64](${BASE_URL}/mcp-client_linux_amd64)
          - [Ubuntu arm64](${BASE_URL}/mcp-client_linux_arm64)
          - [Windows x64](${BASE_URL}/mcp-client_windows_amd64.exe)
          - [Windows arm64](${BASE_URL}/mcp-client_windows_arm64.exe)
          - [macOS Apple Silicon (arm64)](${BASE_URL}/mcp-client_darwin_arm64)
          - [macOS Intel (x64)](${BASE_URL}/mcp-client_darwin_amd64)

          ## Checksums
          - [checksums.txt](${BASE_URL}/checksums.txt)
          EOF

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --generate-notes \
            --notes-file release_notes.md \
            --title "${GITHUB_REF_NAME}"

  cleanup_failed_release:
    needs:
      - validate_tag
      - build
      - registry_state
      - docker_image
      - release
    if: |
      always() && (
        needs.validate_tag.result != 'success' ||
        needs.build.result != 'success' ||
        needs.registry_state.result != 'success' ||
        needs.docker_image.result != 'success' ||
        needs.release.result != 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete partial release if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && gh release delete "${GITHUB_REF_NAME}" --yes || true

      - name: Log in to GitHub Container Registry
        if: needs.registry_state.result == 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: needs.registry_state.result == 'success'
        uses: docker/setup-buildx-action@v4

      - name: Restore image channels
        if: needs.registry_state.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          PREVIOUS_LATEST: ${{ needs.registry_state.outputs.latest_digest }}
          PREVIOUS_ROLLING: ${{ needs.registry_state.outputs.rolling_digest }}
        run: |
          image_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null \
              | jq -r '.digest // empty' || true
          }

          owner="${GITHUB_REPOSITORY_OWNER}"
          package="${GITHUB_REPOSITORY#*/}"
          owner_type="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.owner.type')"
          if [[ "${owner_type}" == "Organization" ]]; then
            versions_api="orgs/${owner}/packages/container/${package}/versions"
          else
            versions_api="users/${owner}/packages/container/${package}/versions"
          fi

          deleted_digests=''
          delete_new_digest() {
            digest="$1"
            if [[ -z "${digest}" || "${digest}" == "${PREVIOUS_LATEST}" || "${digest}" == "${PREVIOUS_ROLLING}" || " ${deleted_digests} " == *" ${digest} "* ]]; then
              return
            fi
            version_id="$(gh api "${versions_api}?per_page=100" --jq ".[] | select(.name == \"${digest}\") | .id")"
            if [[ -z "${version_id}" ]]; then
              echo "Unable to find GHCR package version for ${digest}" >&2
              return 1
            fi
            gh api --method DELETE "${versions_api}/${version_id}"
            deleted_digests="${deleted_digests} ${digest}"
          }

          release_digest="$(image_digest "${IMAGE}:${GITHUB_REF_NAME}")"
          latest_digest="$(image_digest "${IMAGE}:latest")"
          rolling_digest="$(image_digest "${IMAGE}:rolling")"
          delete_new_digest "${release_digest}"
          if [[ "${latest_digest}" != "${PREVIOUS_LATEST}" ]]; then
            delete_new_digest "${latest_digest}"
          fi
          if [[ "${rolling_digest}" != "${PREVIOUS_ROLLING}" ]]; then
            delete_new_digest "${rolling_digest}"
          fi
          if [[ -n "${PREVIOUS_LATEST}" && "${latest_digest}" != "${PREVIOUS_LATEST}" ]]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${PREVIOUS_LATEST}"
          fi
          if [[ -n "${PREVIOUS_ROLLING}" && "${rolling_digest}" != "${PREVIOUS_ROLLING}" ]]; then
            docker buildx imagetools create --tag "${IMAGE}:rolling" "${IMAGE}@${PREVIOUS_ROLLING}"
          fi

      - name: Delete failed tag from remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ":refs/tags/${GITHUB_REF_NAME}"
